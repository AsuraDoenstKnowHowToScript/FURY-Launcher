name: Release

# Builds the Windows self-contained single-file .exe and publishes a GitHub
# Release with it attached. Run it from the Actions tab ("Run workflow") or via
# the API; set the version (without the leading v).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 1.5.2)"
        required: true
        default: "1.5.2"
      prerelease:
        description: "Mark as a pre-release (beta)?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Writes the CurseForge API key from a repo secret so it is embedded in the build.
      # The secret is passed through an environment variable, NOT interpolated into the
      # script: CurseForge keys are bcrypt strings ($2a$10$...) and inlining them lets bash
      # re-expand the $ sequences and corrupt the key. Reading it from $CF_KEY keeps it
      # intact. If the secret is unset the file is empty and the source stays disabled.
      # The key file is git-ignored and never committed.
      - name: Embed CurseForge key
        shell: bash
        env:
          CF_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: printf '%s' "$CF_KEY" > Launcher.Core/curseforge.key

      - name: Restore
        run: dotnet restore Bonfire.sln

      - name: Publish (win-x64, self-contained, single file)
        run: >
          dotnet publish Launcher.App/Launcher.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none -p:DebugSymbols=false
          -o dist/win-x64

      - name: Show published files
        shell: pwsh
        run: Get-ChildItem dist/win-x64 | Select-Object Name, Length | Format-Table -AutoSize

      - name: Package
        shell: pwsh
        run: |
          $zip = "Bonfire-Launcher-v${{ github.event.inputs.version }}-win-x64.zip"
          Compress-Archive -Path dist/win-x64/* -DestinationPath $zip -Force
          "ASSET=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          FURY Launcher is now **Bonfire Launcher**. New name, new mark, and the
          interface rebuilt around it.

          ## Your data comes with you
          Nothing is lost in the rename. On first run the launcher adopts your existing
          data folder rather than starting an empty one beside it, so instances,
          accounts and hours played are exactly where you left them. Packs export as
          `.bfpack` now and still import the older `.frpack`.

          ## Servers
          A multiplayer tab that reads the server list the game itself keeps, so servers
          you joined in game are already there. MOTD in the server's own colours, player
          counts, version, icon and latency all come from the server over Minecraft's own
          Server List Ping — including the SRV lookup the game does, which is what most
          public servers actually answer on. A short directory of public servers by
          region ships with it, pinged live like everything else.

          ## Modpacks
          Browse Modrinth modpacks and install one as a fresh instance, or into an
          instance you already have. A pack is a Minecraft version, a loader and a mod
          list together, so taking over an existing instance switches it to what the pack
          needs — and tells you exactly what it will become before it does.

          ## The look
          Iron and titanium on black. No colour anywhere except the three states that
          mean something, so anything coloured on screen is information. Surfaces are
          translucent films over a backdrop rather than flat panels, edges are a titanium
          sweep, and hovering answers with a rim and a tonal step that hold while the
          pointer is there. Typeface is Inter, which keeps its shape at the small sizes
          this interface is full of.

          Also: real settings that do something (hardware acceleration, JVM presets,
          reset to defaults), a reworked sidebar, and scrolling that no longer steps.

          ## How to run
          Download the zip below, unzip, run `Bonfire Launcher.exe`. Windows 10/11
          (64-bit), self-contained: no .NET or Java install required.
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          FLAGS="--latest"
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then FLAGS="--prerelease"; fi
          # Idempotent: drop any existing release + tag for this version, then recreate.
          gh release delete "v${{ github.event.inputs.version }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v${{ github.event.inputs.version }}" "$ASSET" \
            --title "Bonfire Launcher v${{ github.event.inputs.version }}" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}" \
            $FLAGS
